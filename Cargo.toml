[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/redact",
    "crates/config",
    "crates/store",
    "crates/kernel",
    "crates/ipc",
    "crates/macos",
    "crates/procs",
    "crates/secrets",
    "crates/ffi",
    "apps/cli",
    "xtask",
    "modules/awake",
    "modules/integrations",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
navori-protocol = { path = "crates/protocol" }
navori-redact = { path = "crates/redact" }
navori-config = { path = "crates/config" }
navori-store = { path = "crates/store" }
navori-kernel = { path = "crates/kernel" }
navori-ipc = { path = "crates/ipc" }
navori-macos = { path = "crates/macos" }
navori-procs = { path = "crates/procs" }
navori-secrets = { path = "crates/secrets" }
navori-mod-awake = { path = "modules/awake" }
navori-mod-integrations = { path = "modules/integrations" }

# Versions = latest stable on crates.io as of 2026-11-01 (`cargo xtask outdated` re-checks).
anyhow = "1.0.104"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
keyring-core = "1.0.1"
libc = "0.2.191"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "pwr_mgt", "libc"] }
predicates = "3.1.4"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt", "codec"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ulid = "3.0.0"
uniffi = "0.32.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Proc-macros and build scripts are dlopen'd by rustc on the host. On macOS 27 (ld-27106)
# a stripped proc-macro dylib fails to load ("mis-aligned LINKEDIT string pool"), so they
# stay unstripped; shipped artifacts are still stripped by the profile above.
[profile.release.build-override]
strip = "none"
