[package]
name = "navori-ffi"
description = "UniFFI surface of the Rust core and composition root of Navori.app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib"]
name = "navori_ffi"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
navori-config.workspace = true
navori-ipc.workspace = true
navori-kernel.workspace = true
navori-protocol.workspace = true
navori-redact.workspace = true
navori-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

# UniFFI generates `#[unsafe(no_mangle)] extern "C"` scaffolding, so this crate cannot
# forbid unsafe code. It contains no hand-written unsafe.
[lints.rust]
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
