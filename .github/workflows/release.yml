name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One constant group: two tags pushed seconds apart must not race on the tap push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      KEYCHAIN_NAME: navori-release.keychain-db
    steps:
      # This workflow imports a system trust root with `sudo security add-trusted-cert`
      # and must never run on a self-hosted runner.
      - name: Require a GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
            echo "::error::Refusing to run: the runner is $RUNNER_ENVIRONMENT, not github-hosted; this workflow trusts a certificate system-wide."
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a tag on main pushed by the owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "Refusing to release: the tag was pushed by $ACTOR, not the repository owner $OWNER." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi

      - name: Check the tag against the workspace version
        id: tag
        run: |
          set -euo pipefail
          cargo xtask release --tag "$GITHUB_REF_NAME" --check > "$RUNNER_TEMP/check.txt"
          cat "$RUNNER_TEMP/check.txt"
          if ! grep -Eq '^version=.+' "$RUNNER_TEMP/check.txt"; then
            echo "The tag check produced no version output." >&2
            exit 1
          fi
          if ! grep -Eq '^prerelease=(true|false)$' "$RUNNER_TEMP/check.txt"; then
            echo "The tag check produced no prerelease=true|false output." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/check.txt" >> "$GITHUB_OUTPUT"

      - name: Run the CI gate
        run: cargo xtask ci

      - name: Find the Release for this tag and reuse its assets
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases" --paginate > "$RUNNER_TEMP/releases.json"
          release=$(jq -s --arg tag "$GITHUB_REF_NAME" \
            'add | map(select(.tag_name == $tag)) | first // empty' "$RUNNER_TEMP/releases.json")
          if [ -z "$release" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          zip="Navori-$VERSION.zip"
          sum="$zip.sha256"
          zip_id=$(jq -r --arg n "$zip" '.assets[] | select(.name == $n) | .id' <<<"$release")
          sum_id=$(jq -r --arg n "$sum" '.assets[] | select(.name == $n) | .id' <<<"$release")
          if [ -z "$zip_id" ] || [ -z "$sum_id" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dist
          gh api -H "Accept: application/octet-stream" "repos/$REPOSITORY/releases/assets/$zip_id" > "dist/$zip"
          gh api -H "Accept: application/octet-stream" "repos/$REPOSITORY/releases/assets/$sum_id" > "dist/$sum"
          echo "reuse=true" >> "$GITHUB_OUTPUT"

      - name: Import the signing identity
        if: steps.existing.outputs.reuse != 'true'
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          keychain_password=$(uuidgen)
          p12="$RUNNER_TEMP/signing.p12"
          security list-keychains -d user | tr -d '"' | sed 's/^ *//' > "$RUNNER_TEMP/keychains.txt"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains.txt")
          cert="$RUNNER_TEMP/signing.cer"
          security find-certificate -c "Navori Local Signing" -p "$keychain" > "$cert"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$cert"
          echo "NAVORI_SIGN_IDENTITY=Navori Local Signing" >> "$GITHUB_ENV"

      - name: Show the usable code-signing identities
        if: steps.existing.outputs.reuse != 'true'
        run: security find-identity -v -p codesigning

      - name: Build the release artifacts
        run: cargo xtask release --tag "$GITHUB_REF_NAME" --out dist

      - name: Create the draft Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes ${flags[@]+"${flags[@]}"}

      - name: Upload the assets
        if: steps.existing.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber "dist/Navori-$VERSION.zip" "dist/Navori-$VERSION.zip.sha256"

      - name: Require the tap token
        if: vars.TAP_REPOSITORY != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_REPOSITORY is set to $TAP_REPOSITORY but the TAP_TOKEN secret is empty." >&2
            exit 1
          fi

      - name: Check out the tap
        if: vars.TAP_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TAP_REPOSITORY }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Put the cask in the tap and audit it
        if: vars.TAP_REPOSITORY != ''
        env:
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            cask=navori-rc
          else
            cask=navori
          fi
          mkdir -p tap/Casks
          cp "dist/$cask.rb" "tap/Casks/$cask.rb"
          git -C tap add "Casks/$cask.rb"
          if ! git -C tap diff --cached --quiet; then
            git -C tap -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$cask $VERSION"
          else
            echo "The cask already names $VERSION; nothing to commit."
          fi
          owner="${TAP_REPOSITORY%%/*}"
          repo="${TAP_REPOSITORY##*/}"
          tap_name="$owner/${repo#homebrew-}"
          brew tap "$tap_name" "$PWD/tap"
          brew trust --cask "$tap_name/$cask"
          brew style --cask "$tap_name/$cask"
          brew audit --cask "$tap_name/$cask"

      - name: Publish the Release
        if: vars.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Check the public asset against the recorded hash
        if: vars.PUBLISH_RELEASE == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          zip="Navori-$VERSION.zip"
          check_dir=$(mktemp -d)
          curl -L --fail --silent --show-error \
            -o "$check_dir/$zip" \
            "https://github.com/$REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip"
          cp "dist/$zip.sha256" "$check_dir/$zip.sha256"
          (cd "$check_dir" && shasum -a 256 -c "$zip.sha256")

      - name: Push the cask to the tap
        if: vars.PUBLISH_RELEASE == 'true' && vars.TAP_REPOSITORY != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        working-directory: tap
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          ahead=$(git rev-list --count "origin/$branch..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "The tap has nothing ahead of origin; nothing to push."
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push origin "HEAD:$branch"

      - name: Summarize the run
        if: success()
        env:
          PUBLISH: ${{ vars.PUBLISH_RELEASE }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then cask=navori-rc; else cask=navori; fi
          if [ "$PUBLISH" != "true" ]; then
            echo "Draft only: $GITHUB_REF_NAME is a draft Release; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TAP_REPOSITORY" ]; then
            echo "Published $GITHUB_REF_NAME and pushed cask $cask to $TAP_REPOSITORY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $GITHUB_REF_NAME; no tap is configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the temporary keychain
        if: always()
        timeout-minutes: 5
        run: |
          # Hosted runners are discarded VMs; remove-trusted-cert hung waiting for authorization, so the trust entry stays.
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.cer"
          if [ -f "$RUNNER_TEMP/keychains.txt" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.txt") || true
          fi
          security delete-keychain "$HOME/Library/Keychains/$KEYCHAIN_NAME" || true
